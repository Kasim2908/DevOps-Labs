services:
  database:
    image: mongo:latest
    container_name: mongodb-env

    ports:
      - "${MONGO_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

volumes:
  mongo-data:
